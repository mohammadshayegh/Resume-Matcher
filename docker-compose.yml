services:
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher
    build:
      context: .
      args:
        # Supabase must be baked in at build time: Next.js inlines
        # NEXT_PUBLIC_* into the client bundle. Leave unset for a single-user
        # image (no sign-in screen). See Dockerfile for the full note.
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: resume-matcher
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - resume-data:/app/backend/data
    #secrets:
    #  - llm_api_key
    environment:
      # domain in reverse proxy
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      # Logging configuration: DEBUG, INFO, WARNING, ERROR
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      #- LOG_LEVEL_FILE=${LOG_LEVEL_FILE:-}
      # Debug level for LiteLLM: DEBUG, INFO, WARNING, ERROR
      - LOG_LLM=${LOG_LLM:-WARNING}
      #- LOG_LLM_FILE=${LOG_LLM_FILE:-}
      # LLM Configuration - configure via Settings UI or set env vars for explicit overrides
      # Supported providers: openai, anthropic, openrouter, gemini, deepseek, ollama
      # Defaults are defined in apps/backend/app/config.py
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      # Codex has its own model catalog and authentication in CODEX_HOME.
      # Keep this explicit so a fresh data volume still selects Codex.
      - CODEX_MODEL=${CODEX_MODEL:-gpt-5.6-luna}
      # Optional Docker Secret file path (same behavior as Postgres-style *_FILE)
      #- LLM_API_KEY_FILE=${LLM_API_KEY_FILE:-/run/secrets/llm_api_key}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # For Ollama running on host machine, use host.docker.internal:
      # - LLM_API_BASE=http://host.docker.internal:11434
      - LLM_API_BASE=${LLM_API_BASE:-}
      # CORS origins (JSON array format). FRONTEND_BASE_URL is auto-included.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Authentication (Supabase, Google OAuth only). Leave SUPABASE_URL empty
      # for single-user mode: no sign-in, all data in one local account. Set it
      # to the SAME project as the NEXT_PUBLIC_SUPABASE_URL build arg above.
      - SUPABASE_URL=${SUPABASE_URL:-}
      # Only for projects still on legacy HS256 JWTs; new projects use JWKS.
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      # Set true for any multi-user deployment so a missing SUPABASE_URL fails
      # at startup instead of serving one shared data partition to everybody.
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
    restart: unless-stopped

#secrets:
#  llm_api_key:
#    file: ./secrets/llm_api_key

volumes:
  resume-data:
    driver: local
