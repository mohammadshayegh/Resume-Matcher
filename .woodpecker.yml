when:
  - event: push
  - event: pull_request
  - event: manual

steps:
  frontend:
    image: node:22-bookworm
    commands:
      - cd apps/frontend
      - npm ci
      - npm run lint
      - npm run typecheck
      - npm test
      - npm run build

  backend:
    image: python:3.13-slim-bookworm
    commands:
      - cd apps/backend
      - pip install --disable-pip-version-check uv
      - uv pip install --system ".[dev]"
      - pytest

  image:
    image: docker:29-cli
    commands:
      - docker build --tag resume-matcher-ci:${CI_COMMIT_SHA} .

  deploy:
    image: docker:29-cli
    # Production settings stay on this PC. This trusted repository gets a
    # read-only mount only for the deploy step; they are never committed.
    volumes:
      - /home/sam/Resume-Matcher/.env:/run/secrets/resume-matcher.env:ro
    commands:
      - docker compose --project-name resume-matcher --env-file /run/secrets/resume-matcher.env up -d --build --remove-orphans
    when:
      - event: push
        branch: main
